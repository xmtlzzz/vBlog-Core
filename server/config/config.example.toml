# Example config. The real config.toml is not committed to the repo.
# Copy this file to config.toml and fill in real values, or override
# everything via environment variables in production:
#   HTTP_ADDR HTTP_PORT HTTP_GRPC_PORT DB_HOST DB_PORT DB_NAME DB_USER
#   DB_PASSWORD JWT_SECRET

[http]
addr = "0.0.0.0"
port = 8080
grpc_port = 50051

[postgres]
host = "127.0.0.1"
port = 5432
name = "change-me"
user = "change-me"
password = "change-me"

[jwt]
secret = "change-me-to-a-long-random-string"
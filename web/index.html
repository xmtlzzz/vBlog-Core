<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vBlog</title>
    <meta name="description" content="记录开发、技术与日常。" />
    <meta property="og:title" content="vBlog" />
    <meta property="og:description" content="记录开发、技术与日常。" />
    <link rel="alternate" type="application/rss+xml" title="vBlog RSS Feed" href="/feed.xml" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var paramTheme = params.get('theme');
          var t = (paramTheme === 'dark' || paramTheme === 'light') ? paramTheme : localStorage.getItem('vblog-theme');
          if (paramTheme === 'dark' || paramTheme === 'light') {
            localStorage.setItem('vblog-theme', paramTheme);
          }
          var isDark = t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
